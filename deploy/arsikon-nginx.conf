server {
    listen 80;
    listen [::]:80;
    server_name arsikon.co.id www.arsikon.co.id;

    # Redirect HTTP → HTTPS (akan otomatis di-handle Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arsikon.co.id www.arsikon.co.id;

    # --- Document Root ---
    root /var/www/arsikon/public;
    index index.php;

    # --- SSL (akan di-isi otomatis oleh Certbot) ---
    # ssl_certificate /etc/letsencrypt/live/arsikon.co.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arsikon.co.id/privkey.pem;

    # =====================================================================
    # DDOS PROTECTION — Rate & Connection Limiting
    # =====================================================================

    # Batasi koneksi simultan per IP (maks 20)
    limit_conn addr 20;

    # Default rate limit untuk semua request (10 req/s, burst 20)
    limit_req zone=general burst=20 nodelay;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # --- Client Body Size (untuk upload file/foto material) ---
    client_max_body_size 50M;

    # --- Timeouts (anti-slowloris) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # --- Buffer Sizes (anti-overflow attacks) ---
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # =====================================================================
    # RATE-LIMITED ROUTES
    # =====================================================================

    # --- Login & Auth (ketat: 5 req/menit, anti brute-force) ---
    location ~ ^/(login|register|forgot-password|reset-password) {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- API Routes (30 req/s) ---
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Static Assets (longgar: 50 req/s, dengan caching) ---
    location ~* \.(css|js|ico|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot|webp|avif)$ {
        limit_req zone=assets burst=100 nodelay;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Block Suspicious User-Agents (bots, scanners, scrapers) ---
    if ($http_user_agent ~* (SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|YandexBot|PetalBot|Bytespider|GPTBot|CCBot|DataForSeoBot|Sogou|Go-http-client|python-requests|curl|wget|nikto|sqlmap|nmap|masscan)) {
        return 403;
    }

    # --- Block Empty User-Agent ---
    if ($http_user_agent = "") {
        return 403;
    }

    # --- Block Suspicious Request Methods ---
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
        return 444;
    }

    # --- Laravel Routing (default) ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout untuk proses berat (report generation, sync Supabase)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # --- Block Hidden Files ---
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Block common attack paths ---
    location ~* (\.php\.bak|\.sql|\.bak|\.old|\.orig|\.swp|\.tmp|\.dist)$ {
        deny all;
    }

    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|myadmin|admin\.php) {
        deny all;
        return 444;
    }

    # --- Logs ---
    access_log /var/log/nginx/arsikon-access.log;
    error_log  /var/log/nginx/arsikon-error.log;
}
