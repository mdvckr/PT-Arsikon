; ==============================================================================
; PT Arsikon — PHP OPcache Configuration (Production)
; ==============================================================================
; Salin file ini ke: /etc/php/8.1/fpm/conf.d/99-arsikon-opcache.ini
; Restart PHP-FPM setelah menyalin: systemctl restart php8.1-fpm
; ==============================================================================

[opcache]
; Aktifkan OPcache
opcache.enable=1
opcache.enable_cli=0

; Memory — 128MB cukup untuk ~3000 file PHP (Laravel + vendor)
opcache.memory_consumption=128

; Interned strings buffer
opcache.interned_strings_buffer=16

; Jumlah file yang bisa di-cache (Laravel ~2500 file)
opcache.max_accelerated_files=10000

; Jangan cek perubahan file di production (restart FPM setelah deploy)
opcache.validate_timestamps=0

; Simpan comments (dibutuhkan oleh Doctrine annotations, Laravel DI)
opcache.save_comments=1

; Preloading (opsional, bisa percepat ~10-15%)
; opcache.preload=/var/www/arsikon/preload.php
; opcache.preload_user=www-data

; JIT Compilation (PHP 8.1+) — percepat kalkulasi/report
opcache.jit=1255
opcache.jit_buffer_size=64M
