# ==============================================================================
# PT Arsikon — Nginx DDoS Protection & Rate Limiting
# ==============================================================================
# Salin file ini ke: /etc/nginx/conf.d/arsikon-ddos-protection.conf
# File ini di-include SEBELUM server block (konteks http {})
# Restart Nginx: systemctl restart nginx
# ==============================================================================

# --- 1. Rate Limiting Zones ---
# Batasi request per IP per detik
# Zone "general": 10 request/detik per IP (burst 20)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Zone "login": 5 request/menit per IP (anti brute-force login)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Zone "api": 30 request/detik per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Zone "assets": 50 request/detik per IP (static files lebih longgar)
limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;

# --- 2. Connection Limiting ---
# Maksimal 20 koneksi simultan per IP
limit_conn_zone $binary_remote_addr zone=addr:10m;

# --- 3. Custom Error Pages untuk Rate Limit ---
# Kembalikan 429 Too Many Requests, bukan 503
limit_req_status 429;
limit_conn_status 429;
